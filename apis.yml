aid: imbee
name: imbee
description: >-
  imBee is an AI-powered business omnichannel messaging platform headquartered in
  Hong Kong that unifies customer conversations across WhatsApp, Instagram,
  Facebook Messenger, WeChat, LINE, and SMS into a single enterprise-grade inbox.
  The platform layers team assignment, tagging, marketing broadcast, chatbot and
  workflow automation, 300+ pre-built integrations (Shopify, HubSpot, Salesforce,
  Stripe, Okta SSO), and generative-AI tools (AiskBee knowledge assistant and an
  autonomous AI Agent) on top of the official WhatsApp Business Platform APIs.
  imBee is ISO 27001 certified with message-level data masking, role-based access,
  and audit logging, and serves 10,000+ enterprises across 60+ industries in
  Asia-Pacific with particular strength in Financial Services, Healthcare,
  Hospitality, Logistics, Property Management, and Retail. Founded in 2019, imBee
  raised US$5M in Series A funding led by DCM Ventures in 2022.
